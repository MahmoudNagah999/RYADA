; RYADA PHP overrides. Loaded after the base image configuration (conf.d/zz-ryada.ini).

; The test suite runs with 512M too (phpunit.xml).
memory_limit = 512M

; Club logos are validated with `max:2048` (2 MB) in UpdateClubLogoRequest.
; 4M upload / 8M post keeps comfortable headroom for multipart overhead.
upload_max_filesize = 4M
post_max_size = 8M
max_file_uploads = 20

; APP_TIMEZONE stays UTC. The business timezones are SUBSCRIPTIONS_TIMEZONE and
; ATTENDANCE_TIMEZONE (Africa/Cairo, DST-aware thanks to tzdata in the image).
date.timezone = UTC

; Do not advertise the PHP version and never print errors into responses.
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL

; OPcache is enabled by the base image. These values are tuned for an application with
; roughly fifteen thousand PHP files. validate_timestamps stays on because this is a
; development image; a production target would set it to 0 and cache the config.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

realpath_cache_size = 4096k
realpath_cache_ttl = 600

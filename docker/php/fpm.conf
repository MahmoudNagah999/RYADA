; RYADA PHP-FPM pool overrides. This file is included after docker.conf and www.conf,
; so it only has to list what changes.

[www]

; The base image already sets clear_env = no; keeping it explicit documents that the
; env_file values from compose must reach the workers (Laravel reads the environment).
clear_env = no

; The app healthcheck talks FastCGI to this path with cgi-fcgi, so the image does not
; need curl. A healthy pool answers "pong".
ping.path = /ping
ping.response = pong

; JSON uploads and API responses are small; the default buffer sizes are fine.
; Anything longer than 60 s is a bug, not a slow page (nginx uses the same timeout).
request_terminate_timeout = 60s

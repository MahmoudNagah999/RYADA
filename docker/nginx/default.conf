# RYADA nginx front controller (issue #36, PR 1).
# Trusted proxy headers are deliberately NOT handled here: they arrive in PR 3, together
# with `trustProxies`. Trusting X-Forwarded-* before that would trust every client.

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Matches post_max_size in docker/php/php.ini. Club logos are validated with
    # `max:2048` (2 MB); 8 MB leaves headroom for multipart overhead.
    client_max_body_size 8m;

    fastcgi_read_timeout 60s;

    # JSON is the API's main payload; gzip helps list endpoints.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript application/xml text/css text/plain;

    # Laravel front controller: serve the file, then the directory, then index.php.
    # This is what makes the /up health route answer through nginx.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny dotfiles (.env, .git) but keep ACME challenges reachable.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Uploaded club logos are reached through public/storage, a symlink into the
    # storage named volume shared with the app container.
    location /storage/ {
        try_files $uri =404;
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # nginx has the same public/ files as the app image, so this path is identical
        # inside both containers.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }
}

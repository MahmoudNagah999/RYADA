# RYADA application stack (issue #36, PR 1).
# Queue worker, Horizon, the scheduler and trusted proxies are PR 2 and PR 3.
#
# Host ports (set them in the shell or the project .env, compose interpolates those only):
#   APP_PORT        nginx, default 8080
#   DB_FORWARD_PORT MySQL, default 3307 (Herd already uses 3306)
# Redis is intentionally not published: the developer already runs `ryada-redis` on 6379.

name: ryada

services:
  app:
    build:
      context: .
      target: app
    image: ryada-app:local
    env_file:
      - .env.docker
    environment:
      # The entrypoint migrates only when this is "true" AND the command is php-fpm,
      # so `docker compose run --rm app php artisan test` never touches MySQL.
      RUN_MIGRATIONS: "true"
    volumes:
      # Uploaded logos, logs and framework state survive `docker compose down`.
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ryada
    restart: unless-stopped
    healthcheck:
      # FastCGI ping against PHP-FPM itself. cgi-fcgi comes from libfcgi-bin, so the
      # image does not need curl just for a healthcheck.
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 20
      # On the first start the entrypoint runs every migration before php-fpm exists,
      # and MySQL has to initialise its data volume first. A cold start on a laptop can
      # take minutes, so the start period is deliberately generous; later starts are
      # healthy in seconds.
      start_period: 300s

  nginx:
    build:
      context: .
      target: nginx
    image: ryada-nginx:local
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only: nginx only serves the logos the app writes into this volume.
      - storage:/var/www/html/storage:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ryada
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mysql:
    image: mysql:8.0
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    env_file:
      - .env.docker
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Optional host access for a GUI client; 3307 avoids Herd's MySQL on 3306.
      - "${DB_FORWARD_PORT:-3307}:3306"
    networks:
      - ryada
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7
    # A local cache/queue does not need the append-only file.
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - ryada
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
  storage:

networks:
  ryada:
    driver: bridge
